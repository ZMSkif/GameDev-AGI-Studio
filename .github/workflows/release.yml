name: Release

# Runs when a maintainer pushes a tag vX.Y.Z (pushing a tag needs the owner's yes, DEC-009).
# The check job re-runs every check on the tagged commit, requires that commit to be on main, and
# checks the tag against both plugin.json files and the CHANGELOG. Only then does the release job,
# the one job with write access, create the GitHub release from the CHANGELOG section, with the plugin
# zip gamedev-studio-X.Y.Z.zip (one top folder, gamedev-studio) attached. An existing
# release is left as is.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag the merge commit on main."
            exit 1
          fi
      - name: Validate JSON contracts and decision manifest
        run: python3 scripts/validate_contracts.py
      - name: Validate plugin manifests, marketplaces, skills, agents and commands
        run: python3 scripts/validate_plugin.py
      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check the tag against the versions and the CHANGELOG
        run: python3 scripts/release_check.py --tag "$GITHUB_REF_NAME"

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Write the release notes from the CHANGELOG
        run: python3 scripts/release_check.py --tag "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/release-notes.md"
      - name: Build the plugin zip (one top folder, gamedev-studio, as INSTALL.md expects)
        run: |
          git archive --format=zip --prefix=gamedev-studio/ -o "$RUNNER_TEMP/gamedev-studio-${GITHUB_REF_NAME#v}.zip" HEAD
          for f in INSTALL.ru.md INSTALL.md scripts/doctor.py .claude-plugin/marketplace.json .claude-plugin/plugin.json; do
            unzip -l "$RUNNER_TEMP/gamedev-studio-${GITHUB_REF_NAME#v}.zip" | grep -qF " gamedev-studio/$f" \
              || { echo "::error::the zip has no gamedev-studio/$f"; exit 1; }
          done
      - name: Create the GitHub release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "gamedev-studio ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "$RUNNER_TEMP/gamedev-studio-${GITHUB_REF_NAME#v}.zip"
          fi
