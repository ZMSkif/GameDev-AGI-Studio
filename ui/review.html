<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; media-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title · GameDev Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #131715;
      --panel: #1b211d;
      --line: #383f38;
      --ink: #f4f1e8;
      --muted: #b5beb3;
      --accent: #c8ed90;
      font: 16px/1.55 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--background); color: var(--ink); }
    a { color: var(--accent); text-underline-offset: .25em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .page { width: min(1120px, 100% - 64px); margin: auto; }
    .masthead { border-bottom: 1px solid var(--line); }
    .masthead .page { padding: 1rem 0; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .brand { color: var(--ink); font-weight: 680; letter-spacing: -.035em; font-size: 1.125rem; }
    .issue-link { font-size: .875rem; }
    main { padding: 3rem 0 4rem; }
    .heading { margin-bottom: 2.75rem; }
    h1 { font-size: clamp(2rem, 7vw, 4.25rem); line-height: 1.03; letter-spacing: -.058em; font-weight: 700; margin: 0 0 1.25rem; overflow-wrap: anywhere; }
    h2 { font-size: 1.35rem; line-height: 1.2; letter-spacing: -.027em; margin: 0; }
    .metadata { display: flex; margin: 0; gap: .75rem 2.5rem; flex-wrap: wrap; }
    dt { color: var(--muted); font-size: .8rem; }
    dd { margin: .2rem 0 0; min-height: 1.55rem; font-weight: 600; }
    code { font-size: .875em; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .verdict[data-status="confirmed"] { color: var(--accent); }
    .verdict[data-status="blocked"] { color: #ff9f8c; }
    .verdict[data-status="pending"] { color: #f6ca83; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .85rem; }
    .switches { display: inline-flex; flex-wrap: wrap; gap: .25rem; padding: .2rem; border: 1px solid var(--line); border-radius: .45rem; }
    .switches button { min-height: 44px; border: 0; border-radius: .3rem; padding: .45rem .8rem; background: transparent; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer; }
    .switches button[aria-pressed="true"] { background: var(--accent); color: #1b2417; font-weight: 650; }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; }
    .capture, .comparison { margin: 0; border: 1px solid var(--line); border-radius: .6rem; overflow: hidden; background: var(--panel); }
    .capture:only-child, .capture:has(video) { grid-column: 1 / -1; }
    .capture img, .capture video { display: block; width: 100%; height: auto; max-height: 68vh; object-fit: contain; background: #0b100d; }
    figcaption, .comparison-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .75rem; padding: .75rem 1rem; }
    figcaption span { color: var(--muted); font-size: .875rem; overflow-wrap: anywhere; }
    .comparison { margin-bottom: .9rem; }
    .layered { position: relative; display: grid; background: #0b100d; --position: 50%; max-height: 62vh; aspect-ratio: var(--ratio); margin-inline: auto; }
    .layered img { width: 100%; height: 100%; max-height: 62vh; object-fit: contain; grid-area: 1 / 1; }
    .layered .before { clip-path: inset(0 calc(100% - var(--position)) 0 0); }
    .cursor { position: absolute; top: 0; bottom: 0; left: var(--position); width: 2px; background: var(--accent); pointer-events: none; }
    .comparison-controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }
    input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--accent); cursor: ew-resize; }
    .empty { grid-column: 1 / -1; padding: 1rem; background: var(--panel); color: var(--muted); }
    details { margin-top: 2rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    summary { padding: 1rem 0; min-height: 44px; font-weight: 680; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: grid; grid-template-columns: 5rem minmax(6rem, 1fr) auto; gap: .4rem .8rem; padding: .75rem 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    li span, li code { color: var(--muted); }
    li code { grid-column: 2 / -1; }
    .note { margin-top: 1rem; font-size: .875rem; color: var(--muted); }
    @media (max-width: 600px) {
      .page { width: calc(100% - 32px); }
      main { padding-top: 2rem; }
      .heading { margin-bottom: 1.75rem; }
      .gallery { grid-template-columns: minmax(0, 1fr); }
      li { grid-template-columns: 4rem minmax(0, 1fr); }
      li span:nth-child(3) { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="page">
      <span class="brand">GameDev Studio</span>
      <a class="issue-link" href="$issue_url">$issue_label #$issue_number</a>
    </div>
  </header>
  <main class="page">
    <header class="heading">
      <h1>$title</h1>
      <dl class="metadata">
        <div>
          <dt>$revision_label</dt>
          <dd><a href="$commit_url" title="$commit"><code>$short_commit</code></a></dd>
        </div>
        <div>
          <dt>$verdict_heading</dt>
          <dd class="verdict" data-status="$verdict_key">$verdict_label</dd>
        </div>
      </dl>
    </header>
    <section aria-labelledby="captures-heading">
      <div class="section-head">
        <h2 id="captures-heading">$capture_heading</h2>
        <div id="switches" class="switches" hidden>
          <button id="grid-button" type="button" aria-pressed="true">$gallery_label</button>
          <button id="compare-button" type="button" aria-pressed="false">$compare_label</button>
        </div>
      </div>
      <figure id="comparison" class="comparison" hidden>
        <div id="layered" class="layered"><span class="cursor" aria-hidden="true"></span></div>
        <div class="comparison-controls">
          <label for="reveal">$before</label>
          <input id="reveal" type="range" min="0" max="100" value="50" aria-label="$range_label">
          <span aria-hidden="true">$after</span>
        </div>
      </figure>
      <div id="gallery" class="gallery">$gallery</div>
    </section>
    <details>
      <summary>$file_details ($file_count)</summary>
      <ul>$file_rows</ul>
    </details>
    <p class="note">$file_note</p>
  </main>
  <script>
    const gallery = document.querySelector("#gallery");
    const before = [...gallery.querySelectorAll('[data-role="before"] img')];
    const after = [...gallery.querySelectorAll('[data-role="after"] img')];

    if (before.length === 1 && after.length === 1) {
      const originals = [before[0], after[0]];
      const comparison = document.querySelector("#comparison");
      const layered = document.querySelector("#layered");
      const reveal = document.querySelector("#reveal");
      const gridButton = document.querySelector("#grid-button");
      const compareButton = document.querySelector("#compare-button");
      const switches = document.querySelector("#switches");

      function enableComparison() {
        const [earlier, later] = originals;
        if (!switches.hidden || !earlier.naturalWidth ||
            earlier.naturalWidth !== later.naturalWidth ||
            earlier.naturalHeight !== later.naturalHeight) return;
        const ratio = earlier.naturalWidth / earlier.naturalHeight;
        layered.style.setProperty("--ratio", ratio);
        layered.style.maxWidth = (ratio * 62) + "vh";
        const base = later.cloneNode();
        const top = earlier.cloneNode();
        top.className = "before";
        layered.prepend(base, top);
        switches.hidden = false;
      }

      for (const image of originals) image.addEventListener("load", enableComparison);
      enableComparison();
      function setCompare(compare) {
        comparison.hidden = !compare;
        for (const image of originals) image.closest("figure").hidden = compare;
        gridButton.setAttribute("aria-pressed", String(!compare));
        compareButton.setAttribute("aria-pressed", String(compare));
      }
      reveal.addEventListener("input", () => layered.style.setProperty("--position", reveal.value + "%"));
      gridButton.addEventListener("click", () => setCompare(false));
      compareButton.addEventListener("click", () => setCompare(true));
    }
  </script>
</body>
</html>
