<!doctype html>
<html lang="$lang" data-ui="$viewer_labels">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; media-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title · GameDev Studio</title>
  <style>$styles</style>
</head>
<body>
  <header class="masthead">
    <div class="page">
      <span class="brand">${brand_mark}GameDev Studio</span>
      <nav class="actions" aria-label="$issue_label">
        $marker_toggle
        <a class="action primary" href="$issue_url">$issue_label #$issue_number</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <header class="report-heading">
      <div>$back_link<h1>$title</h1></div>
      <dl class="metadata">
        $revisions
        <div>
          <dt>$verdict_heading</dt>
          <dd class="pill" data-status="$verdict_key">$verdict_label</dd>
        </div>
      </dl>
    </header>
    $inspector
    <section class="section" aria-labelledby="captures-heading">
      <div class="section-head">
        <h2 id="captures-heading">$capture_heading</h2>
        <div id="switches" class="switches" hidden>
          <button id="grid-button" type="button" aria-pressed="true">$gallery_label</button>
          <button id="compare-button" type="button" aria-pressed="false">$compare_label</button>
        </div>
      </div>
      <figure id="comparison" class="comparison panel" hidden>
        <div id="layered" class="layered"><span class="cursor" aria-hidden="true"></span></div>
        <div class="comparison-controls">
          <label for="reveal">$before</label>
          <input id="reveal" type="range" min="0" max="100" value="50" aria-label="$range_label">
          <span aria-hidden="true">$after</span>
        </div>
      </figure>
      <div id="gallery" class="gallery">$gallery</div>
    </section>
    <details class="file-details panel">
      <summary>$file_details ($file_count)</summary>
      <ul>$file_rows</ul>
    </details>
    <p class="note">$file_note</p>
  </main>
  <script>$script</script>
</body>
</html>
