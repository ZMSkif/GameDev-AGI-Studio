<!doctype html>
<html lang="$lang" data-ui="$viewer_labels">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title · GameDev Studio</title>
  <style>$styles</style>
</head>
<body>
  <header class="masthead">
    <div class="page">
      <span class="brand">${brand_mark}GameDev Studio</span>
      <nav class="actions">$issue_link</nav>
    </div>
  </header>
  <main class="page">
    <header class="summary-title">
      <div>
        <p class="eyebrow">$eyebrow</p>
        <h1>$title</h1>
        <p class="subtitle">$subtitle</p>
      </div>
    </header>
    <dl class="stats">$stats</dl>
    $callout
    $groups
    <p class="note">$note</p>
  </main>
  <script>$script</script>
</body>
</html>
