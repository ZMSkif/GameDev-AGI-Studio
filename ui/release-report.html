<!doctype html>
<html lang="$lang" data-ui="$viewer_labels">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title · GameDev Studio</title>
  <style>$styles</style>
</head>
<body>
  <header class="masthead">
    <div class="page">
      <span class="brand">${brand_mark}GameDev Studio</span>
      <nav class="actions">$issue_link</nav>
    </div>
  </header>
  <main class="page">
    <header class="summary-title">
      <div>
        <p class="eyebrow">$eyebrow</p>
        <h1>$title</h1>
        <p class="subtitle">$subtitle</p>
      </div>
      <span class="pill large" data-status="$overall_key">$overall_label</span>
    </header>
    <dl class="stats">$stats</dl>
    <p class="callout warning">$caveat</p>
    <div class="section-head"><h2>$checks_heading</h2></div>
    <div class="release-grid">$cards</div>
    <section class="section">
      <div class="section-head"><h2>$files_heading<span class="count">$file_count</span></h2></div>
      <div class="panel table-wrap">$files</div>
    </section>
    <p class="note">$note</p>
  </main>
  <script>$script</script>
</body>
</html>
